# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# ============================
# GENERAL SETTINGS
# ============================
add_newline = true

# ============================
# PROMPT CHARACTER
# ============================
[character]
success_symbol = '[➜](bold green)'

# ============================
# COMMAND DURATION
# ============================
[cmd_duration]
min_time = 100
format = 'took [$duration](yellow)'

# ============================
# DIRECTORY
# ============================
[directory]
truncate_to_repo = true

# ============================
# GIT BRANCH
# ============================
[git_branch]
ignore_branches = ['master', 'main']

# ============================
# KUBERNETES
# ============================
[kubernetes]
disabled = false
style = "bold red"
# Show the symbol, the aliased context, and the active namespace
format = '[$symbol $context( \($namespace\))]($style) '

#
# ALIAS RULES (These are correct)
#

# Rule 1
[[kubernetes.contexts]]
context_alias = "$2/($3)"
context_pattern = '^([^/]+)/api-(.*)-nvidia-com:[^/]+/([^@]+)@nvidia\.com ( \([^)]+\))$'

# Rule 2
[[kubernetes.contexts]]
context_alias = "$2/($3)"
context_pattern = '^([^/]+)/api-(.*)-nvidia-com:[^/]+/([^@]+)@nvidia\.com$'

# Rule 3
[[kubernetes.contexts]]
context_alias = "$2"
context_pattern = '^([^/]+)/api-(.*)-nvidia-com.*$'

# Rule 4
[[kubernetes.contexts]]
context_alias = "$1"
context_pattern = '.*api-(.*)-nvidia-com.*$'
